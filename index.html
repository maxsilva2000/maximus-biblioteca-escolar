<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Máximus Biblioteca Escolar</title>
<style>
:root{
  --fundo:#0D0E10; --card:#16181C; --card2:#1E2127; --topo:#0A0B0D;
  --ouro:#C9A227; --ouro2:#E7CE84; --prata:#BFC4CC;
  --texto:#EDEAE3; --soft:#9A9891; --linha:#26292F; --forte:#3A3E45;
  --disp:#79BF9B; --empr:#87ADE0; --atra:#E0705F; --res:#D9B26A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--fundo);color:var(--texto);min-height:100vh;
 font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;font-size:15px}
body.semnav{padding-bottom:24px}
h1,h2,h3,.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;margin:0}
h1{font-size:21px;letter-spacing:.01em;color:var(--ouro2)}
h2{font-size:18px;margin-bottom:10px;color:var(--ouro2)}
h3{font-size:16px;color:var(--texto)}
p{line-height:1.55}
.wrap{max-width:660px;margin:0 auto;padding:14px}

header{background:var(--topo);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:20;
 border-bottom:1px solid rgba(201,162,39,.32)}
.topo{display:flex;align-items:center;gap:11px;max-width:660px;margin:0 auto}
.topo .txt{flex:1;min-width:0}
.sub{font-size:11.5px;color:var(--soft);margin-top:2px;letter-spacing:.09em;text-transform:uppercase}
.voltar{background:transparent;border:1px solid rgba(201,162,39,.5);color:var(--ouro2);border-radius:8px;
 padding:8px 12px;font:inherit;font-size:13.5px;cursor:pointer}

.marca{background:linear-gradient(180deg,#0A0B0D,#131519);border:1px solid rgba(201,162,39,.4);border-radius:12px;
 padding:22px 16px;text-align:center;margin-bottom:12px}
.marca .nome{font-family:Georgia,serif;font-size:27px;letter-spacing:.16em;color:var(--ouro);margin-top:10px;font-weight:600}
.marca .fio{width:76px;height:1px;background:linear-gradient(90deg,transparent,var(--ouro),transparent);margin:9px auto}
.marca .desc{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#F4F2ED}

.cartao{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:14px;margin-bottom:12px}
.ficha{position:relative;padding-left:22px}
.ficha:before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:1px;background:var(--ouro);opacity:.5}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:16px 12px;text-align:left;
 font:inherit;font-size:15px;font-weight:600;color:var(--texto);cursor:pointer;min-height:92px;
 display:flex;flex-direction:column;justify-content:space-between}
.tile:active{background:var(--card2);border-color:rgba(201,162,39,.45)}
.ico{font-size:23px;display:block}

.num{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha)}
.num:last-child{border-bottom:0}
.num b{font-size:19px;font-family:Georgia,serif;font-weight:600;color:var(--ouro2)}
.rot{font-size:13px;color:var(--soft)}
.dir{font-size:14px;text-align:right;max-width:60%}

button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
 background:linear-gradient(180deg,#E7CE84,#C9A227);color:#14150F;border:0;
 border-radius:9px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;width:100%;text-align:center}
.btn:active{opacity:.85}
.btn.sec{background:transparent;color:var(--ouro2);border:1.5px solid rgba(201,162,39,.65)}
.btn.per{background:transparent;color:var(--atra);border:1.5px solid rgba(224,112,95,.6)}
.btn.mini{width:auto;padding:10px 14px;font-size:13.5px}
.btn[disabled]{opacity:.4;cursor:default}
.linhab{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.campo{margin-bottom:11px}
.campo label{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--forte);border-radius:8px;background:var(--card2);
 font:inherit;font-size:16px;color:var(--texto)}
input::placeholder,textarea::placeholder{color:#6E6C66}
textarea{min-height:86px;resize:vertical}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.carimbo{display:inline-block;border:1.5px solid;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:800;
 letter-spacing:.06em;text-transform:uppercase;transform:rotate(-4deg);white-space:nowrap}
.c-disponivel{color:var(--disp);border-color:var(--disp)}
.c-emprestado{color:var(--empr);border-color:var(--empr)}
.c-atrasado{color:var(--atra);border-color:var(--atra)}
.c-reservado{color:var(--res);border-color:var(--res)}

.reg{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--soft);letter-spacing:.04em}
.capa{width:52px;height:74px;object-fit:cover;border-radius:4px;border:1px solid var(--forte);background:#232529;
 flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;color:#6E6C66}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha);cursor:pointer;
 width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.item:last-child{border-bottom:0}
.meta{font-size:13px;color:var(--soft);margin-top:2px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--topo);
 border-top:1px solid rgba(201,162,39,.3);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 1px 10px;font-size:10px;color:var(--soft);cursor:pointer}
nav button .ico{font-size:19px;margin-bottom:2px}
nav button.on{color:var(--ouro2);font-weight:700}

.busca{margin-bottom:4px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--forte);background:var(--card);border-radius:20px;padding:7px 12px;
 font-size:13px;color:var(--soft);cursor:pointer}
.chip.on{background:linear-gradient(180deg,#E7CE84,#C9A227);color:#14150F;border-color:var(--ouro);font-weight:600}

.vazio{text-align:center;color:var(--soft);font-size:14px;padding:32px 16px;line-height:1.55}
.aviso{background:rgba(201,162,39,.09);border:1px solid rgba(201,162,39,.4);border-radius:9px;padding:11px 13px;
 font-size:13.5px;line-height:1.5;margin-bottom:12px;color:#E9E3D2}
.erro{background:rgba(224,112,95,.1);border-color:rgba(224,112,95,.5);color:#F0BDB4}
.ok{background:rgba(121,191,155,.1);border-color:rgba(121,191,155,.45);color:#BFE3CF}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--linha);white-space:nowrap}
th{color:var(--ouro2);font-weight:600;font-size:12px}

.folha{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.etiqueta{background:#fff;color:#111;border:1.5px solid #111;border-radius:5px;padding:10px;text-align:center;
 width:100%;max-width:250px;margin:0 auto}
.etiqueta .esc{font-size:10px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;color:#111}
.etiqueta .rg{font-family:Georgia,serif;font-size:24px;margin:2px 0;color:#111}
.etiqueta .cat{font-size:11px;color:#333;margin-bottom:4px}
.etiqueta .reg{color:#444}
.etiqueta svg{display:block;margin:0 auto}

.giro{width:16px;height:16px;border:2px solid var(--forte);border-top-color:var(--ouro);border-radius:50%;
 animation:g .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes g{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.giro{animation-duration:2.5s}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--ouro2);outline-offset:2px}

#scanner{position:fixed;inset:0;background:#08090A;z-index:60;display:none;flex-direction:column}
#scanner video{flex:1;width:100%;object-fit:cover}
#scanner .barra{padding:14px;display:flex;gap:10px;background:#08090A}
#scanner .mira{position:absolute;top:50%;left:8%;right:8%;height:140px;margin-top:-70px;border:2px solid var(--ouro);border-radius:10px}

#toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:50;display:none}
#toast .aviso{margin:0;box-shadow:0 8px 26px rgba(0,0,0,.55)}

.abas{display:flex;gap:8px;margin-bottom:14px}
.abas button{flex:1;background:transparent;border:0;border-bottom:2px solid var(--linha);color:var(--soft);
 padding:10px 4px;cursor:pointer;font-size:14px}
.abas button.on{color:var(--ouro2);border-bottom-color:var(--ouro);font-weight:700}
.papel{font-size:11px;border:1px solid var(--forte);border-radius:20px;padding:3px 9px;color:var(--soft);white-space:nowrap}
.papel.dev{color:var(--ouro2);border-color:var(--ouro)}
.papel.admin{color:var(--disp);border-color:var(--disp)}
.papel.pendente{color:var(--res);border-color:var(--res)}

@media print{
  header,nav,.naoimprime,.marca{display:none!important}
  body{background:#fff;color:#111;padding:0;font-size:12px}
  .cartao{border:0;padding:0;margin:0;background:#fff;color:#111}
  h1,h2,h3,.num b,th{color:#111}
  .rot,.meta,.reg,td{color:#333}
  th,td{white-space:normal;border-bottom:1px solid #ccc}
  .folha{grid-template-columns:repeat(3,1fr);gap:6mm}
  .etiqueta{page-break-inside:avoid;break-inside:avoid;border:1px dashed #999}
}
</style>
</head>
<body>
<header id="cabecalho">
  <div class="topo">
    <span id="marcaTopo"></span>
    <div class="txt"><h1 id="titulo">Máximus</h1><div class="sub" id="subtitulo"></div></div>
    <button class="voltar" id="acaoTopo" hidden></button>
  </div>
</header>

<main class="wrap" id="app"></main>
<nav id="nav"></nav>

<div id="scanner">
  <div style="position:relative;flex:1;display:flex"><video id="video" playsinline muted></video><div class="mira"></div></div>
  <div class="barra"><button class="btn sec" data-acao="fecharScanner">Fechar</button></div>
</div>

<div id="toast"><div class="aviso" id="toastTxt"></div></div>

<script src="config.js"></script>
<script>
/* ================================================================
   Máximus Biblioteca Escolar
   Contas com login, dados no Firebase, painel do desenvolvedor.
   ================================================================ */

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const semAcento = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const hoje = () => new Date().toISOString().slice(0,10);
const somarDias = (iso,d) => { const x=new Date(iso+"T12:00:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); };
const brDate = iso => iso ? iso.split("-").reverse().join("/") : "";
const diasAte = iso => Math.round((new Date(iso+"T12:00:00") - new Date(hoje()+"T12:00:00"))/86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const reg = n => String(n).padStart(5,"0");
const soDigitos = s => String(s||"").replace(/\D/g,"");

const CATEGORIAS = ["Romance","Literatura","Literatura brasileira","Literatura estrangeira","Ficção","Fantasia","Aventura",
"Suspense","Mistério","Poesia","Biografia","História","Ciências","Educação","Infantojuvenil","Infantil","HQ/Gibis","Outros"];
const NOME_STATUS = {disponivel:"Disponível", emprestado:"Emprestado", atrasado:"Atrasado", reservado:"Reservado"};

/* ---------- marca ---------- */
function brasao(tam, mono){
  const o = mono ? "#111" : "#C9A227", p = mono ? "#444" : "#BFC4CC";
  return `<svg width="${tam}" height="${tam}" viewBox="0 0 100 100" aria-label="Máximus">
    <path d="M50 8 L86 20 v34 c0 20 -18 32 -36 38 c-18 -6 -36 -18 -36 -38 V20 Z" fill="none" stroke="${o}" stroke-width="2.4"/>
    <path d="M50 14 L80 24 v30 c0 17 -15 27 -30 32 c-15 -5 -30 -15 -30 -32 V24 Z" fill="none" stroke="${o}" stroke-width="1"/>
    <path d="M50 28 L68 35 L50 42 L32 35 Z" fill="${o}"/>
    <path d="M32 62 c8 -3 14 -3 18 1 c4 -4 10 -4 18 -1 v12 c-8 -3 -14 -3 -18 1 c-4 -4 -10 -4 -18 -1 Z"
      fill="none" stroke="${p}" stroke-width="2"/>
    <path d="M50 63 v12" stroke="${o}" stroke-width="1.6"/>
  </svg>`;
}
function marcaImg(estilo, mono){
  const src = (S.cfg && S.cfg.logo) || "marca.png";
  return `<img src="${src}" alt="Máximus" style="${estilo}${mono?";filter:brightness(0)":""}"
    onerror="this.outerHTML=brasao(${mono?20:34}${mono?",true":""})">`;
}

/* ================================================================
   Firebase: contas e dados na nuvem
   ================================================================ */
let FB = null, USUARIO = null, escutas = [];
const DEV_EMAILS = ["maximocontato1@gmail.com"];
const WHATS = "5566996641404";
const PAPEIS = {dev:"Desenvolvedor", admin:"Administrador", auxiliar:"Auxiliar", bloqueado:"Bloqueado"};
const ehDev = () => !!USUARIO && USUARIO.papel === "dev";
const ehAdmin = () => !!USUARIO && (USUARIO.papel === "admin" || ehDev());
function exigeAdmin(){
  if(ehAdmin()) return true;
  avisar("Só o administrador da biblioteca pode fazer isso.", "erro");
  return false;
}

async function iniciarFirebase(){
  const v = "10.12.2";
  const [appMod, authMod, fsMod] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`)
  ]);
  const app = appMod.initializeApp(window.FIREBASE_CONFIG);
  const auth = authMod.getAuth(app);
  await authMod.setPersistence(auth, authMod.browserLocalPersistence).catch(()=>{});
  let db;
  try{ db = fsMod.initializeFirestore(app, {localCache: fsMod.persistentLocalCache({})}); }
  catch(e){ db = fsMod.getFirestore(app); }
  FB = {app, auth, A: authMod, db, F: fsMod};
}

const bid = () => USUARIO.bibliotecaId;
const refDoc = (loja, id) => FB.F.doc(FB.db, "bibliotecas", bid(), loja, id);
const refCol = (loja) => FB.F.collection(FB.db, "bibliotecas", bid(), loja);
const guardar = (loja, obj) => FB.F.setDoc(refDoc(loja, obj.id), obj);
const apagar = (loja, id) => FB.F.deleteDoc(refDoc(loja, id));
async function todos(loja){ const s = await FB.F.getDocs(refCol(loja)); return s.docs.map(d=>d.data()); }
async function limpar(loja){ const s = await FB.F.getDocs(refCol(loja)); await Promise.all(s.docs.map(d=>FB.F.deleteDoc(d.ref))); }

const S = { obras:[], alunos:[], emprestimos:[],
  cfg:{escola:"Biblioteca escolar", prazo:7, proxReg:1, apiKey:"", logo:""} };
let tela = "inicio", ctx = {};

const refCfg = () => FB.F.doc(FB.db, "bibliotecas", bid(), "config", "config");
const salvarCfg = () => FB.F.setDoc(refCfg(), S.cfg);

function ouvirDados(){
  pararEscutas();
  const on = FB.F.onSnapshot;
  escutas.push(on(refCol("obras"), s => { S.obras = s.docs.map(d=>d.data()); desenhar(); }));
  escutas.push(on(refCol("alunos"), s => { S.alunos = s.docs.map(d=>d.data()); desenhar(); }));
  escutas.push(on(refCol("emprestimos"), s => { S.emprestimos = s.docs.map(d=>d.data()); desenhar(); }));
  escutas.push(on(refCfg(), d => { if(d.exists()){ S.cfg = Object.assign(S.cfg, d.data()); desenhar(); } }));
}
function pararEscutas(){ escutas.forEach(f => { try{ f(); }catch(e){} }); escutas = []; }

async function carregarTudo(){
  const d = await FB.F.getDoc(refCfg());
  if(d.exists()) S.cfg = Object.assign(S.cfg, d.data()); else await salvarCfg();
  S.obras = await todos("obras");
  S.alunos = await todos("alunos");
  S.emprestimos = await todos("emprestimos");
  ouvirDados();
}

const perfilDe = async u => { const d = await FB.F.getDoc(FB.F.doc(FB.db,"usuarios",u)); return d.exists()?d.data():null; };

async function criarConta({nome, email, senha, escola, codigo}){
  const cred = await FB.A.createUserWithEmailAndPassword(FB.auth, email.trim(), senha);
  const u = cred.user.uid;
  await FB.A.updateProfile(cred.user, {displayName: nome}).catch(()=>{});
  const dev = DEV_EMAILS.includes(email.trim().toLowerCase());
  let bibliotecaId = u, papel = dev ? "dev" : "admin", aprovado = dev;

  if(codigo && codigo.trim()){
    const q = FB.F.query(FB.F.collection(FB.db,"bibliotecas"), FB.F.where("codigo","==",codigo.trim().toUpperCase()));
    const s = await FB.F.getDocs(q);
    if(s.empty) throw new Error("Código da biblioteca não encontrado. Confira com o administrador.");
    bibliotecaId = s.docs[0].id;
    papel = dev ? "dev" : "auxiliar";
  }
  const perfil = {uid:u, nome, email: email.trim().toLowerCase(), papel, aprovado, bibliotecaId,
    criadoEm:new Date().toISOString()};
  await FB.F.setDoc(FB.F.doc(FB.db,"usuarios",u), perfil);
  if(bibliotecaId === u){
    await FB.F.setDoc(FB.F.doc(FB.db,"bibliotecas",u), {id:u, nome: escola||"Biblioteca escolar", dono:u,
      codigo:u.slice(0,8).toUpperCase(), criadoEm:new Date().toISOString()});
  }
  return perfil;
}

function erroAuth(e){
  const c = (e && e.code) || "", m = (e && e.message) || "";
  if(/invalid-credential|wrong-password|user-not-found/.test(c)) return "E-mail ou senha incorretos.";
  if(c.includes("email-already-in-use")) return "Este e-mail já tem conta. Toque em Entrar.";
  if(c.includes("weak-password")) return "A senha precisa ter ao menos 6 caracteres.";
  if(c.includes("invalid-email")) return "E-mail inválido.";
  if(c.includes("too-many-requests")) return "Muitas tentativas. Espere um pouco.";
  if(c.includes("network")) return "Sem conexão com a internet.";
  if(c.includes("operation-not-allowed")) return "Ative E-mail/senha no Firebase, em Authentication.";
  return m || "Não consegui completar a operação.";
}

/* ---------- avisos ---------- */
let tToast;
function avisar(txt, tipo="ok"){
  const t = $("#toast"), c = $("#toastTxt");
  c.className = "aviso " + (tipo==="erro" ? "erro" : tipo==="ok" ? "ok" : "");
  c.textContent = txt;
  t.style.display = "block";
  clearTimeout(tToast);
  tToast = setTimeout(()=> t.style.display="none", 4200);
}

/* ---------- derivados ---------- */
const obraDoRegistro = r => S.obras.find(o => o.exemplares.some(x => x.registro===r));
const alunoPorId = i => S.alunos.find(a => a.id===i);
const obra = i => S.obras.find(o => o.id===i);
const emprestimoAberto = r => S.emprestimos.find(e => e.registro===r && !e.devolucao);
function statusDe(registro){
  const e = emprestimoAberto(registro);
  if(e) return diasAte(e.prevista) < 0 ? "atrasado" : "emprestado";
  const o = obraDoRegistro(registro);
  const x = o && o.exemplares.find(x => x.registro===registro);
  return (x && x.reservado) ? "reservado" : "disponivel";
}
function totais(){
  const st = S.obras.flatMap(o => o.exemplares.map(x => statusDe(x.registro)));
  return {livros:st.length, titulos:S.obras.length,
    disponiveis:st.filter(s=>s==="disponivel").length,
    emprestados:st.filter(s=>s==="emprestado").length,
    atrasados:st.filter(s=>s==="atrasado").length, alunos:S.alunos.length};
}

/* ================================================================
   Identificação de livros
   ================================================================ */
async function lerCodigo(arq){
  if(!("BarcodeDetector" in window)) return null;
  try{
    const d = new BarcodeDetector({formats:["ean_13","ean_8","code_39","code_128","qr_code","upc_a"]});
    const bmp = arq instanceof Blob ? await createImageBitmap(arq) : arq;
    const r = await d.detect(bmp);
    return r.length ? r[0].rawValue : null;
  }catch(e){ return null; }
}
const MAPA_CAT = [[/juvenil|young adult/i,"Infantojuvenil"],[/juvenile|children|infantil|picture book/i,"Infantil"],
[/comic|graphic novel|manga/i,"HQ/Gibis"],[/poetry|poesia/i,"Poesia"],[/biograph|memoir/i,"Biografia"],
[/history|históri/i,"História"],[/science|ciênc|matemát|física|química|biolog/i,"Ciências"],
[/education|pedagog|educa/i,"Educação"],[/fantasy|fantas/i,"Fantasia"],[/mystery|mistério/i,"Mistério"],
[/thriller|suspense/i,"Suspense"],[/adventure|aventura/i,"Aventura"],[/romance/i,"Romance"],
[/brazilian|brasileira/i,"Literatura brasileira"],[/fiction|ficção/i,"Ficção"],[/literary|literatura/i,"Literatura"]];
const adivinharCategoria = t => (MAPA_CAT.find(([re])=>re.test(t||"")) || [,""])[1];

/* Bases de livros consultadas em cascata.
   A Câmara Brasileira do Livro vem primeiro porque cobre o catálogo nacional,
   que é onde o Google Books costuma falhar. */

async function porBrasilAPI(isbn){
  const r = await fetch("https://brasilapi.com.br/api/isbn/v1/" + isbn);
  if(!r.ok) return null;
  const v = await r.json();
  if(!v || !v.title) return null;
  return {
    titulo: v.title + (v.subtitle ? ": " + v.subtitle : ""),
    autor: (v.authors || []).join(", "),
    editora: v.publisher || "",
    ano: v.year ? String(v.year) : "",
    isbn: isbn,
    paginas: v.page_count ? String(v.page_count) : "",
    sinopse: (v.synopsis || "").slice(0, 600),
    categoria: adivinharCategoria((v.subjects || []).join(" ") + " " + (v.synopsis || "")),
    capaUrl: v.cover_url || "",
    fonte: "Câmara Brasileira do Livro"
  };
}

async function porMercadoEditorial(isbn){
  const r = await fetch("https://api.mercadoeditorial.org/api/v1.2/book?isbn=" + isbn);
  if(!r.ok) return null;
  const j = await r.json();
  const b = j && j.books && j.books[0];
  if(!b || !b.titulo) return null;
  const autores = (b.contribuicao || []).filter(c => !c.codigo_contribuicao || c.codigo_contribuicao === "1")
    .map(c => [c.nome, c.sobrenome].filter(Boolean).join(" ")).join(", ");
  const capa = b.imagens && b.imagens.imagem_primeira_capa ? b.imagens.imagem_primeira_capa.media : "";
  return {
    titulo: b.titulo + (b.subtitulo ? ": " + b.subtitulo : ""),
    autor: autores,
    editora: b.editora && b.editora.nome ? b.editora.nome : "",
    ano: b.ano_edicao ? String(b.ano_edicao) : (b.data_publicacao || "").slice(0,4),
    isbn: isbn,
    edicao: b.numero_edicao ? String(b.numero_edicao) + "ª" : "",
    paginas: b.paginas ? String(b.paginas) : "",
    sinopse: (b.sinopse || "").slice(0, 600),
    categoria: adivinharCategoria((b.sinopse || "") + " " + (b.palavras_chave || "")),
    capaUrl: capa || "",
    fonte: "Mercado Editorial"
  };
}

async function porGoogleBooks(consulta, isbn){
  const r = await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=1&q=" + consulta);
  if(!r.ok) return null;
  const j = await r.json();
  const v = j.items && j.items[0] && j.items[0].volumeInfo;
  if(!v || !v.title) return null;
  return {
    titulo: v.title + (v.subtitle ? ": " + v.subtitle : ""),
    autor: (v.authors || []).join(", "),
    editora: v.publisher || "",
    ano: (v.publishedDate || "").slice(0, 4),
    isbn: isbn || ((v.industryIdentifiers || []).find(i => i.type === "ISBN_13") || {}).identifier || "",
    paginas: v.pageCount ? String(v.pageCount) : "",
    sinopse: (v.description || "").slice(0, 600),
    categoria: adivinharCategoria((v.categories || []).join(" ") + " " + (v.description || "")),
    capaUrl: v.imageLinks ? (v.imageLinks.thumbnail || "").replace("http://", "https://") : "",
    fonte: "Google Books"
  };
}

async function porOpenLibrary(isbn){
  const r = await fetch("https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:" + isbn);
  if(!r.ok) return null;
  const j = await r.json();
  const v = j["ISBN:" + isbn];
  if(!v || !v.title) return null;
  return {
    titulo: v.title, autor: (v.authors || []).map(a => a.name).join(", "),
    editora: (v.publishers || []).map(p => p.name).join(", "),
    ano: (v.publish_date || "").slice(-4), isbn: isbn,
    paginas: v.number_of_pages ? String(v.number_of_pages) : "", sinopse: "",
    categoria: adivinharCategoria((v.subjects || []).map(s => s.name).join(" ")),
    capaUrl: v.cover ? v.cover.medium : "", fonte: "Open Library"
  };
}

async function buscarBiblio({isbn, texto}){
  const limpo = soDigitos(isbn);
  if(limpo.length >= 10){
    const fontes = [
      () => porBrasilAPI(limpo),
      () => porMercadoEditorial(limpo),
      () => porGoogleBooks("isbn:" + limpo, limpo),
      () => porOpenLibrary(limpo)
    ];
    for(const f of fontes){
      try{ const r = await f(); if(r && r.titulo) return r; }catch(e){}
    }
    return null;
  }
  if(texto){
    try{ return await porGoogleBooks(encodeURIComponent(texto), ""); }catch(e){}
  }
  return null;
}

const PROMPT = `Você recebe fotos da capa ou contracapa de um livro, e/ou um texto de busca.
Identifique a obra e responda APENAS com um objeto JSON, sem markdown:
{"titulo":"","autor":"","editora":"","ano":"","isbn":"","edicao":"","categoria":"","paginas":"","sinopse":"","confianca":"alta|media|baixa"}
"categoria" deve ser exatamente um destes valores: ` + CATEGORIAS.join(", ") + `.
"sinopse" com 2 ou 3 frases em português do Brasil. "ano" e "paginas" apenas números.
Nunca invente ISBN. Se não identificar, devolva campos vazios e confianca "baixa".`;

async function identificarPorFoto(imgs, texto){
  const content = imgs.map(data => ({type:"image", source:{type:"base64", media_type:"image/jpeg", data}}));
  content.push({type:"text", text: PROMPT + (texto ? "\nTexto informado: "+texto : "")});
  const headers = {"Content-Type":"application/json"};
  if(S.cfg.apiKey){
    headers["x-api-key"] = S.cfg.apiKey;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers,
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content}]})});
  if(!r.ok) throw new Error(r.status===401||r.status===403
    ? "A chave da IA não foi aceita. Confira em Ajustes."
    : "A identificação por foto não respondeu. Use o código de barras ou preencha à mão.");
  const j = await r.json();
  const txt = (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const i = txt.indexOf("{"), f = txt.lastIndexOf("}");
  if(i<0) throw new Error("Não consegui ler a resposta. Preencha à mão.");
  return JSON.parse(txt.slice(i,f+1));
}

function reduzir(file, largura, qual){
  return new Promise((ok,err)=>{
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const e = Math.min(1, largura/img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*e); c.height = Math.round(img.height*e);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        ok(c.toDataURL("image/jpeg", qual));
      };
      img.onerror = () => err(new Error("Não consegui abrir a imagem."));
      img.src = fr.result;
    };
    fr.onerror = () => err(new Error("Não consegui ler o arquivo."));
    fr.readAsDataURL(file);
  });
}

/* ---------- código de barras Code 39 ---------- */
const C39 = {"0":"101001101101","1":"110100101011","2":"101100101011","3":"110110010101","4":"101001101011",
"5":"110100110101","6":"101100110101","7":"101001011011","8":"110100101101","9":"101100101101","A":"110101001011",
"B":"101101001011","C":"110110100101","D":"101011001011","E":"110101100101","F":"101101100101","G":"101010011011",
"H":"110101001101","I":"101101001101","J":"101011001101","K":"110101010011","L":"101101010011","M":"110110101001",
"N":"101011010011","O":"110101101001","P":"101101101001","Q":"101010110011","R":"110101011001","S":"101101011001",
"T":"101011011001","U":"110010101011","V":"100110101011","W":"110011010101","X":"100101101011","Y":"110010110101",
"Z":"100110110101","-":"100101011011",".":"110010101101"," ":"100110101101","*":"100101101101"};
function svgBarras(valor, altura=36){
  const seq = ("*"+String(valor).toUpperCase()+"*").split("").map(c=>C39[c]||C39["-"]).join("0");
  const w = 1.6; let x = 0, r = "";
  for(const b of seq){ if(b==="1") r += `<rect x="${x}" y="0" width="${w}" height="${altura}" fill="#111"/>`; x += w; }
  return `<svg viewBox="0 0 ${x} ${altura}" width="190" height="${altura}" preserveAspectRatio="none">${r}</svg>`;
}

function listaAcervo(){
  const q = semAcento(ctx.q||""), ordem = ctx.ordem||"registro", cat = ctx.cat||"";
  const lista = S.obras.filter(o => {
    if(cat && o.categoria!==cat) return false;
    if(!q) return true;
    return [o.titulo,o.autor,o.editora,o.categoria,o.isbn,o.secao].some(c=>semAcento(c).includes(q))
      || o.exemplares.some(x=>x.registro.includes(q));
  });
  const chave = o => ordem==="registro" ? (o.exemplares[0]?o.exemplares[0].registro:"zzzzz")
    : ordem==="local" ? ((o.estante||"zz")+"-"+(o.prateleira||"zz")) : semAcento(o[ordem]||"zzz");
  return lista.sort((a,b)=> chave(a)<chave(b) ? -1 : 1);
}

function buscaAoVivo(idCampo, chave){
  const i = $(idCampo);
  if(!i) return;
  i.addEventListener("input", () => {
    ctx[chave] = i.value;
    clearTimeout(ctx.t);
    ctx.t = setTimeout(()=>{ const p=i.selectionStart; desenhar(); const n=$(idCampo); if(n){n.focus(); n.setSelectionRange(p,p);} }, 240);
  });
}

const RELS = [["acervo","Lista completa do acervo"],["categoria","Livros por categoria"],["autor","Livros por autor"],
  ["emprestados","Livros emprestados"],["atrasados","Livros atrasados"],["disponiveis","Livros disponíveis"],
  ["historico","Histórico de empréstimos"],["estante","Acervo por estante"],["quantidade","Quantidade por categoria"],
  ["alunos","Alunos cadastrados"]];

function linhasRelatorio(tipo){
  const ex = S.obras.flatMap(o=>o.exemplares.map(x=>({Registro:x.registro, Titulo:o.titulo, Autor:o.autor,
    Editora:o.editora, Ano:o.ano, Categoria:o.categoria, ISBN:o.isbn, Estante:o.estante, Prateleira:o.prateleira,
    Secao:o.secao, Status:NOME_STATUS[statusDe(x.registro)]})));
  const daEmp = e => { const o=obraDoRegistro(e.registro), a=alunoPorId(e.alunoId);
    return {Registro:e.registro, Titulo:o?o.titulo:"", Aluno:a?a.nome:"", Turma:a?a.turma:"", Matricula:a?a.matricula:"",
      Emprestimo:brDate(e.emprestimo), Previsao:brDate(e.prevista), Devolucao:e.devolucao?brDate(e.devolucao):"",
      Situacao: e.devolucao?"Devolvido":diasAte(e.prevista)<0?"Atrasado":"Em aberto"}; };
  switch(tipo){
    case "acervo": return ex;
    case "categoria": return [...ex].sort((a,b)=>(a.Categoria||"zz")<(b.Categoria||"zz")?-1:1);
    case "autor": return [...ex].sort((a,b)=>semAcento(a.Autor)<semAcento(b.Autor)?-1:1);
    case "estante": return [...ex].sort((a,b)=>((a.Estante||"zz")+a.Prateleira)<((b.Estante||"zz")+b.Prateleira)?-1:1);
    case "disponiveis": return ex.filter(l=>l.Status==="Disponível");
    case "emprestados": return S.emprestimos.filter(e=>!e.devolucao).map(daEmp);
    case "atrasados": return S.emprestimos.filter(e=>!e.devolucao && diasAte(e.prevista)<0).map(daEmp);
    case "historico": return S.emprestimos.map(daEmp);
    case "alunos": return S.alunos.map(a=>({Nome:a.nome, Turma:a.turma, Matricula:a.matricula, Telefone:a.telefone,
      EmMaos:S.emprestimos.filter(e=>e.alunoId===a.id && !e.devolucao).length,
      TotalEmprestimos:S.emprestimos.filter(e=>e.alunoId===a.id).length}));
    case "quantidade": { const c={}; S.obras.forEach(o=>{const k=o.categoria||"Sem categoria"; c[k]=(c[k]||0)+o.exemplares.length;});
      return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([Categoria,Exemplares])=>({Categoria,Exemplares})); }
  }
  return [];
}

/* ================================================================
   Scanner
   ================================================================ */
let stream = null, lendo = false, aoLer = null;
async function abrirScanner(cb){
  if(!("BarcodeDetector" in window)){ avisar("Este navegador não lê códigos pela câmera. Use o Chrome no Android ou digite o número.", "erro"); return; }
  aoLer = cb;
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); }
  catch(e){ avisar("Não consegui abrir a câmera. Verifique a permissão do navegador.", "erro"); return; }
  const v = $("#video"); v.srcObject = stream; await v.play();
  $("#scanner").style.display = "flex"; lendo = true;
  const det = new BarcodeDetector({formats:["ean_13","ean_8","code_39","code_128","qr_code","upc_a"]});
  const laco = async () => {
    if(!lendo) return;
    try{ const r = await det.detect(v); if(r.length){ const val=r[0].rawValue; fecharScanner(); if(aoLer) aoLer(val); return; } }catch(e){}
    requestAnimationFrame(laco);
  };
  requestAnimationFrame(laco);
}
function fecharScanner(){
  lendo = false; $("#scanner").style.display = "none";
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
}
async function tratarCodigo(valor){
  const o = obraDoRegistro(valor) || S.obras.find(x=>soDigitos(x.isbn) && soDigitos(x.isbn)===soDigitos(valor));
  if(o){ ir("obra", {id:o.id}); avisar("Livro encontrado no acervo."); return; }
  avisar("Não está no acervo. Buscando os dados...");
  const d = await buscarBiblio({isbn:valor});
  ir("cadastro");
  if(d){ Object.assign(ctx.form, d); desenhar(); avisar("Dados encontrados. Confira antes de salvar."); }
  else { ctx.form.isbn = valor; desenhar(); avisar("Livro novo para as bases. Preencha título e autor à mão e salve.", "erro"); }
}

  tirarLogo: async () => { S.cfg.logo = ""; await salvarCfg(); desenhar(); avisar("Voltamos ao brasão Máximus."); },
  escolherPlanilha: () => $("#arqPlanilha").click(),
  modelo: () => exportarPlanilha([{Titulo:"O Pequeno Príncipe", Autor:"Antoine de Saint-Exupéry", Editora:"Agir",
    Ano:2015, ISBN:"9788522008731", Edicao:"2a", Categoria:"Infantojuvenil", Paginas:96, Exemplares:3,
    Estante:"03", Prateleira:"02", Secao:"Literatura"}], "modelo-importacao"),
  backup: () => {
    const dados = {versao:2, geradoEm:new Date().toISOString(), cfg:S.cfg, obras:S.obras, alunos:S.alunos, emprestimos:S.emprestimos};
    baixar(new Blob([JSON.stringify(dados)], {type:"application/json"}), "backup-biblioteca-"+hoje()+".json");
    avisar("Backup baixado.");
  },
  restaurar: () => { if(exigeAdmin()) $("#arqBackup").click(); },

  /* usuários */
  recarregarUsuarios: () => carregarUsuarios(),
  aprovar: el => mudarUsuario(el.dataset.u, {aprovado:true}),
  promover: el => mudarUsuario(el.dataset.u, {papel:"admin"}),
  bloquear: el => { if(confirm("Bloquear o acesso desta pessoa?")) mudarUsuario(el.dataset.u, {aprovado:false}); },

  fecharScanner: () => fecharScanner()
};

document.addEventListener("input", e => {

/* ---------- painel de usuários ---------- */
async function carregarUsuarios(){
  try{
    const col = FB.F.collection(FB.db, "usuarios");
    const q = ehDev() ? col : FB.F.query(col, FB.F.where("bibliotecaId","==",USUARIO.bibliotecaId));
    const s = await FB.F.getDocs(q);
    ctx.usuarios = s.docs.map(d=>d.data()).sort((a,b)=>semAcento(a.nome)<semAcento(b.nome)?-1:1);
    desenhar();
  }catch(e){ avisar("Não consegui carregar a lista de usuários.", "erro"); }
}
async function mudarUsuario(u, campos){
  try{
    await FB.F.updateDoc(FB.F.doc(FB.db,"usuarios",u), campos);
    avisar("Usuário atualizado.");
    carregarUsuarios();
  }catch(e){ avisar("Não consegui atualizar. Confira suas permissões.", "erro"); }
}

/* ---------- arquivos ---------- */
function baixar(blob, nome){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}
function exportarPlanilha(linhas, nome){
  if(!linhas.length){ avisar("Nada para exportar.", "erro"); return; }
  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), nome.slice(0,28));
    XLSX.writeFile(wb, nome.replace(/\s+/g,"-").toLowerCase()+".xlsx");
  }else{
    const cols = Object.keys(linhas[0]);
    const csv = [cols.join(";")].concat(linhas.map(l=>cols.map(c=>`"${String(l[c]==null?"":l[c]).replace(/"/g,'""')}"`).join(";"))).join("\n");
    baixar(new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"}), nome.replace(/\s+/g,"-").toLowerCase()+".csv");
  }
  avisar("Arquivo gerado.");
}

document.addEventListener("change", async e => {
  const t = e.target;

  if(t.id==="arqCapa" && t.files[0]){
    const f = t.files[0];
    try{
      const grande = await reduzir(f, 1100, 0.82), thumb = await reduzir(f, 260, 0.6);
      ctx.fotos = [{grande, thumb}];
      if(!ctx.form.capa) ctx.form.capa = thumb;
      const cod = await lerCodigo(f);
      desenhar();
      if(cod){
        avisar("Código de barras encontrado na foto. Buscando...");
        const d = await buscarBiblio({isbn:cod});
        if(d){ Object.assign(ctx.form, d); desenhar(); avisar("Dados encontrados. Confira antes de salvar."); t.value=""; return; }
      }
      avisar("Foto adicionada. Toque em Buscar dados do livro.");
    }catch(err){ avisar(err.message, "erro"); }
    t.value = "";
  }

  if(t.id==="arqLogo" && t.files[0]){
    try{ S.cfg.logo = await reduzir(t.files[0], 420, 0.9); await salvarCfg(); desenhar(); avisar("Logomarca aplicada."); }
    catch(err){ avisar("Não consegui ler a imagem.", "erro"); }
    t.value = "";
  }

  if(t.id==="arqPlanilha" && t.files[0]){
    try{
      if(!window.XLSX) throw new Error("A leitura de planilhas precisa de internet.");
      const buf = await t.files[0].arrayBuffer();
      const wb = XLSX.read(buf);
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      let n = S.cfg.proxReg, criadas = 0;
      for(const l of linhas){
        const pega = (...ks) => { for(const k of ks){ const c = Object.keys(l).find(x=>semAcento(x)===semAcento(k));
          if(c && l[c]!==undefined) return String(l[c]); } return ""; };
        const titulo = pega("Titulo","Título","Nome","Livro");
        if(!titulo) continue;
        const qtd = Math.max(1, parseInt(pega("Exemplares","Quantidade","Qtd"))||1);
        const ex = []; for(let i=0;i<qtd;i++) ex.push({registro: reg(n++)});
        await guardar("obras", {id:uid(), titulo, autor:pega("Autor"), editora:pega("Editora"), ano:pega("Ano"),
          isbn:pega("ISBN"), edicao:pega("Edicao","Edição"), categoria:pega("Categoria"), paginas:pega("Paginas","Páginas"),
          sinopse:pega("Sinopse"), capa:"", capaUrl:"", estante:pega("Estante"), prateleira:pega("Prateleira"),
          secao:pega("Secao","Seção"), criadoEm:hoje(), criadoPor:USUARIO.uid, exemplares:ex});
        criadas++;
      }
      S.cfg.proxReg = n; await salvarCfg();
      avisar(criadas ? criadas+" título(s) importado(s)." : "Nenhuma linha com título foi encontrada.", criadas?"ok":"erro");
    }catch(err){ avisar(err.message || "Não consegui ler a planilha.", "erro"); }
    t.value = "";
  }

  if(t.id==="arqBackup" && t.files[0]){
    try{
      const d = JSON.parse(await t.files[0].text());
      if(!d.obras) throw new Error();
      if(!confirm("Restaurar o backup substitui todos os dados atuais. Continuar?")){ t.value=""; return; }
      await limpar("obras"); await limpar("alunos"); await limpar("emprestimos");
      for(const o of d.obras) await guardar("obras", o);
      for(const a of d.alunos||[]) await guardar("alunos", a);
      for(const e of d.emprestimos||[]) await guardar("emprestimos", e);
      if(d.cfg){ S.cfg = Object.assign(S.cfg, d.cfg); await salvarCfg(); }
      ir("inicio"); avisar("Backup restaurado.");
    }catch(err){ avisar("Arquivo de backup inválido.", "erro"); }
    t.value = "";
  }
});

(async function(){

  tela = "entrar"; ctx = {modo:"entrar"}; desenhar();

  FB.A.onAuthStateChanged(FB.auth, async user => {
    if(!user){ USUARIO = null; pararEscutas(); tela = "entrar"; ctx = {modo:"entrar"}; desenhar(); return; }
    let perfil = null;
    for(let i=0;i<6 && !perfil;i++){
      perfil = await perfilDe(user.uid);
      if(!perfil) await new Promise(r=>setTimeout(r,500));
    }
    if(!perfil){ avisar("Não encontrei seu perfil. Entre em contato pelo WhatsApp.", "erro"); return; }

    try{ await carregarTudo(); }catch(e){ avisar("Não consegui carregar os dados. Verifique a internet.", "erro"); }
    if(tela==="entrar" || tela==="pendente") tela = "inicio";
    desenhar();
    if(ehAdmin()) carregarUsuarios();
  });

  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
